# dbt_project.yml
name: 'ga4_streaming_demo'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# -----------------------------------------------------------------------------
# Model configurations
# -----------------------------------------------------------------------------
models:
  ga4_streaming_demo:
    # Staging layer: raw events from BigQuery → clean schema
    stg:
      +materialized: view
      +schema: stg

    # Intermediate layer: attribution, deduplication, enrichment
    int:
      +materialized: view
      +schema: int

    # Mart layer: aggregated metrics and reports
    mart:
      +materialized: incremental
      +schema: mart
      +unique_key: event_id
      +on_schema_change: append_new_columns
