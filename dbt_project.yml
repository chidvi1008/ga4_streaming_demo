name: 'ga4_streaming_demo'
version: '1.0.0'
config-version: 2

# dbt profile to use for connections
profile: 'default'

# Paths for different dbt resources
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Compiled SQL location
target-path: "target"

# Directories removed by `dbt clean`
clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  ga4_streaming_demo:
    stg:
      +materialized: view          # staging: raw events
    int:
      +materialized: view          # intermediate: cleaned / deduped
    mart:
      +materialized: incremental   # mart: First/Last click attribution
